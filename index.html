<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Madre terra di Sardegna - Farris Marco</title><style>body{font-family:system-ui;margin:0;background:#fdf8ef;color:#222}header{background:#173d2a;color:#fff;padding:22px;text-align:center}nav{display:flex;gap:8px;overflow:auto;background:#fff;padding:10px;position:sticky;top:0;border-bottom:2px solid #eee}nav button{white-space:nowrap;border:0;background:#eee;padding:10px 14px;border-radius:999px;font-weight:700;cursor:pointer}nav button.active{background:#173d2a;color:#fff}main{max-width:1000px;margin:auto;padding:16px}img{width:100%;height:260px;object-fit:cover;border-radius:16px}.card{background:#fff;border-radius:18px;padding:14px;margin:14px 0;box-shadow:0 4px 16px rgba(0,0,0,.08)}h2{color:#173d2a}.badge{display:inline-block;background:#ffe58c;padding:6px 10px;border-radius:999px;font-weight:700}.warn{background:#fff3cd;border:2px solid #e6b800;padding:14px;border-radius:14px}.danger{background:#ffe3e3;border:2px solid #d00;padding:14px;border-radius:14px}a{color:#173d2a;font-weight:700}footer{background:#173d2a;color:#fff;text-align:center;padding:20px;margin-top:20px}.hidden{display:none}</style></head><body>
<header><h1 style="margin:0;font-size:34px">Madre terra di Sardegna</h1><p style="margin:8px 0 0"><b>Di Farris Marco</b><br>Per racconti, escursioni e segnalazioni: <a style="color:#ffe58c" href="mailto:shardanaiglesiente@gmail.com">shardanaiglesiente@gmail.com</a></p></header>
<nav id="nav"></nav><main id="main"></main>
<footer>Di Farris Marco — shardanaiglesiente@gmail.com<br>Madre terra di Sardegna • Iglesias, Sulcis-Iglesiente</footer>
<script>
const pages={
home:`<h2>Benvenuto nella mia Sardegna</h2><p>Mare, monti, boschi, borghi e tavola. Questa è la terra che racconto.</p><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1000&q=70"><div class="card"><b>Esplora:</b> usa il menu in alto: Mare, Montagne, Borghi, Cucina, Funghi. Le Mie Foto è l'ultima voce.</div>`,
mare:`<h2>Mare e Spiagge</h2><p>Acqua turchese, sabbia bianca, rispetto per dune e posidonia. Non portare via sabbia e conchiglie.</p>
<div class="card"><h3>Cala Goloritze</h3><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1000&q=70"><p>Guglia di calcare, Golfo di Orosei. A piedi o in barca.</p></div>
<div class="card"><h3>La Pelosa, Stintino</h3><img src="https://images.unsplash.com/photo-1519046904884-53103b34b206?w=1000&q=70"><p>Sabbia bianca, acqua bassissima, perfetta per famiglie.</p></div>
<div class="card"><h3>Cala Mariolu</h3><img src="https://images.unsplash.com/photo-1502680390469-be75c86b636f?w=1000&q=70"><p>Ciottoli bianchi, acqua cristallina, da Cala Gonone.</p></div>
<div class="card"><h3>Chia e Tuerredda</h3><img src="https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?w=1000&q=70"><p>Dune, ginepri, mare caraibico nel sud.</p></div>
<div class="card"><h3>Porto Giunco, Villasimius</h3><img src="https://images.unsplash.com/photo-1505142468610-359e7d316be0?w=1000&q=70"><p>Laguna con fenicotteri rosa.</p></div>
<div class="card"><h3>Costa Rei</h3><img src="https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?w=1000&q=70"><p>8 km di spiaggia bianca.</p></div>
<div class="card"><h3>Bosa Marina</h3><img src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?w=1000&q=70"><p>Case colorate sul fiume Temo, tramonto.</p></div>
<div class="card"><h3>Snorkeling</h3><img src="https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=1000&q=70"><p>Tartaruga, pesci, posidonia. Guarda senza toccare.</p></div>`,
montagne:`<h2>Montagne del Sulcis e Monte Marganai</h2><p>Le montagne più antiche d'Italia, sopra Iglesias. Punta San Michele circa 900 m, vista fino al mare.</p>
<div class="card"><h3>Monte Marganai</h3><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1000&q=70"><p>Massiccio calcareo, sentieri tra rocce e boschi.</p></div>
<div class="card"><h3>Vegetazione: bosco di lecci</h3><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1000&q=70"><p>Leccio, il re del Marganai. Ghiande, ombra, funghi in autunno.</p></div>
<div class="card"><h3>Macchia mediterranea</h3><img src="https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=1000&q=70"><p>Corbezzolo, cisto, mirto, lentisco, rosmarino.</p></div>
<div class="card"><h3>Animali: cervo sardo</h3><img src="https://images.unsplash.com/photo-1484406566174-9da000fda645?w=1000&q=70"><p>Bramito in autunno. Osservare in silenzio, da lontano.</p></div>
<div class="card"><h3>Animali: muflone</h3><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000&q=70"><p>Corna a spirale, vive sulle rocce.</p></div>
<div class="card"><h3>Animali: cinghiale</h3><img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1000&q=70"><p>Cerca ghiande. Prudenza con i piccoli.</p></div>
<div class="card"><h3>Animali: aquila reale</h3><img src="https://images.unsplash.com/photo-1611689342806-0863700ce1e4?w=1000&q=70"><p>Vola alta sopra le creste. Binocolo, mai disturbare i nidi.</p></div>
<div class="card"><h3>Trekking</h3><img src="https://images.unsplash.com/photo-1551632811-561732d1e306?w=1000&q=70"><p>3 sentieri: passeggiata nel bosco, Punta San Michele, Cammino di Santa Barbara. Acqua, scarponi, cappello, tornare prima del buio.</p></div>`,
borghi:`<h2>Iglesias, la mia città</h2><p>Città medievale, Villa di Chiesa, città delle miniere.</p>
<div class="card"><h3>Centro storico</h3><img src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?w=1000&q=70"><p>Vicoli in pietra, forni, botteghe.</p></div>
<div class="card"><h3>Cattedrale di Santa Chiara</h3><img src="https://images.unsplash.com/photo-1548013146-72479768bada?w=1000&q=70"><p>Gotico-catalana, XIII secolo.</p></div>
<div class="card"><h3>Castello Salvaterra</h3><img src="https://images.unsplash.com/photo-1533154683836-84cc7c555ba7?w=1000&q=70"><p>Vista su tutta Iglesias al tramonto.</p></div>
<div class="card"><h3>Miniere e Monteponi - Le risorse</h3><img src="https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=1000&q=70"><p>Piombo, zinco, argento. Villaggi minerari, pozzi, gallerie, archeologia industriale.</p></div>
<div class="card"><h3>Porto Flavia a Masua</h3><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1000&q=70"><p>Porto sospeso sulla scogliera, 1924, Pan di Zucchero.</p></div>
<div class="card"><h3>Grotta di San Giovanni</h3><img src="https://images.unsplash.com/photo-1504893524553-b855bce32c67?w=1000&q=70"><p>A Domusnovas, grotta attraversata dalla strada.</p></div>
<div class="card"><h3>Cultura: Settimana Santa</h3><img src="https://images.unsplash.com/photo-1519791883288-dc8bd696e667?w=1000&q=70"><p>Processioni, Is Baballottis, costumi, canti.</p></div>
<div class="card"><h3>Piazza Sella</h3><img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=1000&q=70"><p>Palme, mercato, prodotti locali.</p></div>`,
cucina:`<h2>Cucina di Sardegna - Ricette</h2><p>Ingredienti semplici, tempo lento, pane sempre in tavola.</p>
<div class="card"><h3>PRIMI - Culurgiones</h3><img src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=1000&q=70"><p>Patate, pecorino, menta. Chiusi a spiga, sugo di pomodoro.</p></div>
<div class="card"><h3>PRIMI - Fregola con vongole</h3><img src="https://images.unsplash.com/photo-1563379926898-05f4575a45d8?w=1000&q=70"><p>Fregola tostata, vongole, pomodorini, aglio.</p></div>
<div class="card"><h3>PRIMI - Malloreddus alla campidanese</h3><img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=1000&q=70"><p>Sugo di salsiccia, zafferano, pecorino.</p></div>
<div class="card"><h3>CARNE - Porceddu arrosto</h3><img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=1000&q=70"><p>Maialino lento, mirto, rosmarino.</p></div>
<div class="card"><h3>CARNE - Pecora in umido</h3><img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=1000&q=70"><p>Con patate e carciofi, cottura lenta.</p></div>
<div class="card"><h3>PESCE - Orata al forno</h3><img src="https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=1000&q=70"><p>Limone, patate, olio, erbe.</p></div>
<div class="card"><h3>PESCE - Polpo alla griglia</h3><img src="https://images.unsplash.com/photo-1559742811-822873691df8?w=1000&q=70"><p>Con patate, prezzemolo, limone.</p></div>
<div class="card"><h3>PESCE - Seppie con piselli</h3><img src="https://images.unsplash.com/photo-1533777857889-4be7c70b33f7?w=1000&q=70"><p>Seppie, piselli, pomodoro, pane per la scarpetta.</p></div>
<div class="card"><h3>DOLCI - Seadas</h3><img src="https://images.unsplash.com/photo-1551024506-0bccd828d307?w=1000&q=70"><p>Formaggio fresco, miele amaro.</p></div>
<div class="card"><h3>PANE - Pane carasau</h3><img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=1000&q=70"><p>Carta da musica, con pecorino e olive.</p></div>`,
funghi:`<h2>Funghi di Sardegna</h2><div class="warn"><b>Regola d'oro:</b> se non sei sicuro al 100%, lascialo nel bosco e fotografalo.</div>
<div class="card"><h3>Porcino - Commestibile eccellente</h3><img src="https://images.unsplash.com/photo-1505820013142-f86a7e2a3f7d?w=1000&q=70"><p>Boletus edulis. Sotto lecci e querce, autunno. Cappello marrone, gambo con reticolo.</p></div>
<div class="card"><h3>Ovolo Buono - Commestibile eccellente</h3><img src="https://images.unsplash.com/photo-1519305124423-5ccccff55da9?w=1000&q=70"><p>Amanita caesarea. Cappello arancione, gambo giallo, sotto lecci.</p></div>
<div class="card"><h3>Finferlo - Commestibile</h3><img src="https://images.unsplash.com/photo-1526318896980-cf78c088247c?w=1000&q=70"><p>Giallo, profumo di albicocca.</p></div>
<div class="card"><h3>Cardoncello - Commestibile</h3><img src="https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=1000&q=70"><p>Il fungo sardo, vicino ai cardi.</p></div>
<div class="card"><h3>Chiodini - Solo ben cotto</h3><img src="https://images.unsplash.com/photo-1476224203421-9ac39bcb3327?w=1000&q=70"><p>A ciuffi sui ceppi, solo cappello, mai crudo.</p></div>
<div class="card"><h3>Mazza di Tamburo - Commestibile</h3><img src="https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=1000&q=70"><p>Alta, anello mobile, prati e radure.</p></div>
<div class="card"><h3>Amanita muscaria - VELENOSA</h3><div class="danger">Solo da fotografare. Cappello rosso con puntini bianchi.</div><img src="https://images.unsplash.com/photo-1505820013142-f86a7e2a3f7d?w=1000&q=70"></div>
<div class="card"><h3>Tignosa verdognola - MORTALE</h3><div class="danger">MAI raccogliere. Si confonde con russule e prataioli.</div><img src="https://images.unsplash.com/photo-1519305124423-5ccccff55da9?w=1000&q=70"></div>`,
foto:`<h2>Le Mie Foto</h2><p>Le tue foto appariranno qui.</p><div class="card">.</div>`
};<img src="foto-1.jpg" style="width:100%; border-radius:15px;">
const order=[['home','Home'],['mare','Mare e Spiagge'],['montagne','Montagne e Trekking'],['borghi','Borghi e Città'],['cucina','Cucina'],['funghi','Funghi di Sardegna'],['foto','Le Mie Foto']];
const nav=document.getElementById('nav'), main=document.getElementById('main');
function show(id){main.innerHTML=pages[id]; document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id)); window.scrollTo(0,0)}
order.forEach(([id,label])=>{const b=document.createElement('button'); b.textContent=label; b.dataset.id=id; b.onclick=()=>show(id); nav.appendChild(b)});
show('home');
</script></body></html>
